<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyResume - בנה קורות חיים מקצועיים</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Rubik:wght@400;700&display=swap');
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(to bottom, #f0f4f8, #e5e9f0);
      color: #333;
      direction: rtl;
    }

    h1, h2, h3 {
      font-family: 'Rubik', sans-serif;
      font-weight: 700;
    }

    p, label, input, button, textarea {
      font-family: 'Assistant', sans-serif;
    }

    header {
      padding: 2rem 1rem;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    header img {
      display: inline-block;
      max-width: 320px;
      transition: transform 0.3s ease;
    }

    header img:hover {
      transform: scale(1.05);
    }

    .hero {
      background: linear-gradient(to right, #4286f4, #6a11cb);
      color: #fff;
      text-align: center;
      padding: 5rem 1rem;
      animation: fadeInUp 1s ease-in-out;
      border-bottom-left-radius: 50px;
      border-bottom-right-radius: 50px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .hero-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .hero p {
      font-size: 1.3rem;
      max-width: 800px;
      margin: 1rem auto 2rem;
    }

    .hero button {
      background: linear-gradient(to right, #FF7E5F, #FEB47B);
      color: #fff;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .hero button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }

    .form-section {
      max-width: 700px;
      margin: 3rem auto;
      background-color: white;
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      animation: fadeInUp 1s ease-in-out;
    }

    label {
      display: block;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }

    textarea, input {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: vertical;
    }
    
    input {
      height: 3rem;
    }

    .input-group {
      position: relative;
    }

    .input-group i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
      pointer-events: none;
    }

    .input-group input, .input-group textarea {
      padding-left: 35px;
    }

    button {
      background-color: #6a11cb;
      background-image: linear-gradient(315deg, #6a11cb 0%, #2575fc 74%);
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      margin-top: 2rem;
      width: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    #result {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: white;
        padding: 2rem;
    }

    #loader {
      display: none;
      text-align: center;
      margin-top: 2rem;
    }

    .spinner {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #2575fc;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #result {
      max-width: 700px;
      margin: 2rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      line-height: 1.6;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    #copyBtn {
      background-color: #444;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    footer {
      font-family: 'Assistant', sans-serif;
      text-align: center;
      padding: 2rem;
      color: #777;
      font-size: 0.9rem;
    }    

    @media (max-width: 600px) {
        font-size: 1.8rem;
      }

      header img {
        max-width: 200px;
      }
    }
  </style>

</head>
<body>
  <header>
    <img src="logo.png" alt="MyResume לוגו" />
    <h2 style="font-family: 'Rubik', sans-serif;">בנה קורות חיים מקצועיים בשניות</h2>
  </header>
  <section class="hero">
    <div class="hero-content">
      <h1>צור קורות חיים מדהימים</h1>
      <p>הפוך את המסע שלך לחיפוש עבודה לקל יותר. הכן קורות חיים מרשימים וייחודיים בקלות ובמהירות!</p>
      <button onclick="document.getElementById('cvForm').scrollIntoView({ behavior: 'smooth' })">התחל עכשיו</button>
    </div>
  </section>
  <section class="form-section">
    <form id="cvForm">
      <div class="input-group">
          <label for="fullName">שם מלא ופרטי יצירת קשר:</label>
          <textarea id="fullName" required></textarea>
      </div>
      <div class="input-group">
          <label for="lastJob">תפקיד אחרון ותחומי אחריות:</label>
          <textarea id="lastJob" required></textarea>
      </div>
      <div class="input-group">
          <label for="skills">3 מיומנויות חזקות:</label>
          <textarea id="skills" required></textarea>
      </div>
      <div class="input-group">
          <label for="desiredRole">מה אתה מחפש עכשיו?</label>
          <textarea id="desiredRole" required></textarea>
      </div>
      <button type="submit">צור את קורות החיים</button>
    </form>
    <div id="loader">
      <div class="spinner"></div>
      <p>בונים לך קורות חיים...</p>
    </div>
    <div id="result" class="hidden"></div>
      <button id="downloadBtn" class="hidden" onclick="downloadPDF()">📄 הורד כקובץ PDF</button>
      <button id="copyBtn" class="hidden" onclick="copyToClipboard()">📋 העתק לקליפבורד</button>
      <button id="closeResultBtn" class="hidden" onclick="closeResultModal()">X סגור</button>
  </section>

  <footer>
    נוצר על ידי <strong>Liad Trabelsi</strong>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    function downloadPDF() {
      const element = document.getElementById("result");
      element.classList.remove("hidden");
      setTimeout(() => {
          html2pdf().from(element).save("cv.pdf");
      }, 300);
    }

    function copyToClipboard() {
        const text = document.getElementById("result").innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("הטקסט הועתק!");
        });
    }

    function openResultModal() {
        document.getElementById("result").style.display = "block";
    }

    function closeResultModal() {
        document.getElementById("result").style.display = "none";
    }

    document.getElementById('cvForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      openResultModal()
      document.getElementById("loader").style.display = "block";
      document.getElementById("result").classList.add("hidden");
      document.getElementById("downloadBtn").classList.add("hidden");
      document.getElementById("copyBtn").classList.add("hidden");

      const data = {
        fullName: document.getElementById('fullName').value,
        lastJob: document.getElementById('lastJob').value,
        skills: document.getElementById('skills').value,
        desiredRole: document.getElementById('desiredRole').value,
      };

      try {
        const response = await fetch("https://hook.eu2.make.com/hvhp4og7trftdb5tmy7zz7zg929kjc3k", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await response.text();
        document.getElementById("loader").style.display = "none";
        document.getElementById("result").innerHTML = marked.parse(result);
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("downloadBtn").classList.remove("hidden");
        document.getElementById("copyBtn").classList.remove("hidden");
        document.getElementById("closeResultBtn").classList.remove("hidden");

      } catch (error) {
        alert("שגיאה בשליחה או בקבלת תגובה.");
        console.error(error);
        document.getElementById("loader").style.display = "none";
      }
    });
  </script>
</body>
</html>
