<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>בנה קורות חיים</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      padding: 2rem;
      direction: rtl;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    form {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: vertical;
    }

    button {
      margin-top: 2rem;
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    #loader {
      display: none;
      text-align: center;
      margin-top: 2rem;
    }

    .spinner {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #007bff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #result {
      max-width: 700px;
      margin: 2rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>צור קורות חיים מקצועיים</h1>
  <form id="cvForm">
    <label for="fullName">שם מלא ופרטי יצירת קשר:</label>
    <textarea id="fullName" name="fullName" required></textarea>

    <label for="lastJob">תפקיד אחרון ותחומי אחריות:</label>
    <textarea id="lastJob" name="lastJob" required></textarea>

    <label for="education">השכלה / הכשרות:</label>
    <textarea id="education" name="education" required></textarea>

    <label for="skills">3 מיומנויות חזקות:</label>
    <textarea id="skills" name="skills" required></textarea>

    <label for="desiredRole">מה אתה מחפש עכשיו?</label>
    <textarea id="desiredRole" name="desiredRole" required></textarea>

    <button type="submit">שלח</button>
  </form>

  <div id="loader">
    <div class="spinner"></div>
    <p>בונים לך קורות חיים...</p>
  </div>

  <div id="result" class="hidden"></div>
  <button id="downloadBtn" class="hidden" onclick="downloadPDF()">📄 הורד כקובץ PDF</button>

  <!-- PDF LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    function downloadPDF() {
      const element = document.getElementById("result");
      element.classList.remove("hidden"); // ודא שהתוצאה גלויה

      setTimeout(() => {
        html2pdf().from(element).save("cv.pdf");
      }, 300); // המתן רגע כדי לוודא שהתוכן מוצג
    }

    document.getElementById('cvForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      document.getElementById("loader").style.display = "block";
      document.getElementById("result").classList.add("hidden");
      document.getElementById("downloadBtn").classList.add("hidden");

      const data = {
        fullName: document.getElementById('fullName').value,
        lastJob: document.getElementById('lastJob').value,
        education: document.getElementById('education').value,
        skills: document.getElementById('skills').value,
        desiredRole: document.getElementById('desiredRole').value,
      };

      try {
        const response = await fetch("https://hook.eu2.make.com/hvhp4og7trftdb5tmy7zz7zg929kjc3k", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data)
        });

        const result = await response.text();

        document.getElementById("loader").style.display = "none";
        document.getElementById("result").innerText = result;
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("downloadBtn").classList.remove("hidden");

      } catch (error) {
        alert("שגיאה בשליחה או בקבלת תגובה.");
        console.error(error
